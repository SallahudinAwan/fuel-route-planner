[project]
name = "fuel-route-api"
version = "1.0.0"
description = "Django API for price-aware fuel stops along US driving routes"
requires-python = ">=3.12"
dependencies = [
    "Django==6.1",
    "djangorestframework>=3.17,<4",
    "pyproj>=3.7,<4",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
    "shapely>=2.1,<3",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
